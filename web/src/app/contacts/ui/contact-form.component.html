<form class="contact-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="contact-form__grid">
    <label class="field">
      <span class="field__label">First name</span>
      <input pInputText formControlName="firstName" (input)="onFieldInput('firstName')" />
      @for (message of messagesFor('firstName'); track message) {
        <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
      }
    </label>

    <label class="field">
      <span class="field__label">Surname</span>
      <input pInputText formControlName="surname" (input)="onFieldInput('surname')" />
      @for (message of messagesFor('surname'); track message) {
        <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
      }
    </label>

    <div class="field">
      <label class="field__label" for="dateOfBirth">Date of birth</label>
      <p-datepicker
        inputId="dateOfBirth"
        formControlName="dateOfBirth"
        dateFormat="yy-mm-dd"
        [maxDate]="today"
        [minDate]="earliest"
        [showIcon]="true"
        appendTo="body"
      />
      @for (message of messagesFor('dateOfBirth'); track message) {
        <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
      }
    </div>

    <label class="field">
      <span class="field__label">Phone number</span>
      <input pInputText formControlName="phoneNumber" (input)="onFieldInput('phoneNumber')" />
      @for (message of messagesFor('phoneNumber'); track message) {
        <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
      }
    </label>

    <label class="field field--wide">
      <span class="field__label">IBAN</span>
      <input pInputText formControlName="iban" (input)="onFieldInput('iban')" />
      @for (message of messagesFor('iban'); track message) {
        <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
      }
    </label>
  </div>

  <fieldset class="contact-form__address" formGroupName="address">
    <legend>Address</legend>

    <div class="contact-form__grid">
      <label class="field field--wide">
        <span class="field__label">Street</span>
        <input pInputText formControlName="street" (input)="onFieldInput('address.street')" />
        @for (message of messagesFor('address.street'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </label>

      <label class="field">
        <span class="field__label">House number</span>
        <input
          pInputText
          formControlName="houseNumber"
          (input)="onFieldInput('address.houseNumber')"
        />
        @for (message of messagesFor('address.houseNumber'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </label>

      <label class="field">
        <span class="field__label">Postal code</span>
        <input
          pInputText
          formControlName="postalCode"
          (input)="onFieldInput('address.postalCode')"
        />
        @for (message of messagesFor('address.postalCode'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </label>

      <label class="field">
        <span class="field__label">City</span>
        <input pInputText formControlName="city" (input)="onFieldInput('address.city')" />
        @for (message of messagesFor('address.city'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </label>

      <div class="field">
        <label class="field__label" for="country">Country</label>
        <p-select
          inputId="country"
          formControlName="country"
          [options]="countries"
          optionLabel="name"
          optionValue="code"
          placeholder="Choose a country"
          [filter]="true"
          filterBy="name"
          appendTo="body"
        />
        @for (message of messagesFor('address.country'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </div>
    </div>
  </fieldset>

  <footer class="contact-form__actions">
    <p-button
      type="submit"
      label="Save"
      icon="pi pi-check"
      [loading]="saving()"
      [disabled]="saving()"
    />
    <p-button
      type="button"
      label="Cancel"
      severity="secondary"
      [text]="true"
      [disabled]="saving()"
      (onClick)="onCancel()"
    />
  </footer>
</form>
