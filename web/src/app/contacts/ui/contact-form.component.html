<form class="contact-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <section class="contact-form__section">
    <div class="contact-form__section-head">
      <h3 class="contact-form__section-title">Personal details</h3>
    </div>

    <div class="contact-form__grid">
      <label class="field field--span-6">
        <span class="field__label"
          >First name <span aria-hidden="true" class="field__required">*</span></span
        >
        <input
          pInputText
          formControlName="firstName"
          autocomplete="given-name"
          (input)="onFieldInput('firstName')"
        />
        @for (message of messagesFor('firstName'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </label>

      <label class="field field--span-6">
        <span class="field__label"
          >Surname <span aria-hidden="true" class="field__required">*</span></span
        >
        <input
          pInputText
          formControlName="surname"
          autocomplete="family-name"
          (input)="onFieldInput('surname')"
        />
        @for (message of messagesFor('surname'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </label>

      <div class="field field--span-6">
        <label class="field__label" for="dateOfBirth">
          Date of birth <span aria-hidden="true" class="field__required">*</span>
        </label>
        <p-datepicker
          inputId="dateOfBirth"
          formControlName="dateOfBirth"
          dateFormat="yy-mm-dd"
          [maxDate]="today"
          [minDate]="earliest"
          [showIcon]="true"
          appendTo="body"
        />
        <small class="field__hint">Format: 2001-04-30</small>
        @for (message of messagesFor('dateOfBirth'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </div>

      <label class="field field--span-6">
        <span class="field__label"
          >Phone number <span aria-hidden="true" class="field__required">*</span></span
        >
        <input
          pInputText
          formControlName="phoneNumber"
          inputmode="tel"
          autocomplete="tel"
          (input)="onFieldInput('phoneNumber')"
        />
        @for (message of messagesFor('phoneNumber'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </label>

      <label class="field field--span-12">
        <span class="field__label"
          >IBAN <span aria-hidden="true" class="field__required">*</span></span
        >
        <input
          pInputText
          formControlName="iban"
          spellcheck="false"
          autocapitalize="characters"
          class="contact-form__iban"
          (input)="onFieldInput('iban')"
        />
        @for (message of messagesFor('iban'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </label>
    </div>
  </section>

  <section class="contact-form__section" formGroupName="address">
    <div class="contact-form__section-head">
      <h3 class="contact-form__section-title">Address</h3>
    </div>

    <div class="contact-form__grid">
      <label class="field field--span-9">
        <span class="field__label"
          >Street <span aria-hidden="true" class="field__required">*</span></span
        >
        <input
          pInputText
          formControlName="street"
          autocomplete="address-line1"
          (input)="onFieldInput('address.street')"
        />
        @for (message of messagesFor('address.street'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </label>

      <label class="field field--span-3">
        <span class="field__label">House number</span>
        <input
          pInputText
          formControlName="houseNumber"
          (input)="onFieldInput('address.houseNumber')"
        />
        @for (message of messagesFor('address.houseNumber'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </label>

      <label class="field field--span-3">
        <span class="field__label"
          >Postal code <span aria-hidden="true" class="field__required">*</span></span
        >
        <input
          pInputText
          formControlName="postalCode"
          autocomplete="postal-code"
          (input)="onFieldInput('address.postalCode')"
        />
        @for (message of messagesFor('address.postalCode'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </label>

      <label class="field field--span-5">
        <span class="field__label"
          >City <span aria-hidden="true" class="field__required">*</span></span
        >
        <input
          pInputText
          formControlName="city"
          autocomplete="address-level2"
          (input)="onFieldInput('address.city')"
        />
        @for (message of messagesFor('address.city'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </label>

      <div class="field field--span-4">
        <label class="field__label" for="country">
          Country <span aria-hidden="true" class="field__required">*</span>
        </label>
        <p-select
          inputId="country"
          formControlName="country"
          [options]="countries"
          optionLabel="name"
          optionValue="code"
          placeholder="Choose a country"
          [filter]="true"
          filterBy="name"
          appendTo="body"
        />
        @for (message of messagesFor('address.country'); track message) {
          <p-message severity="error" variant="simple" size="small">{{ message }}</p-message>
        }
      </div>
    </div>
  </section>

  <footer class="contact-form__actions">
    <span class="contact-form__required-note" aria-hidden="true">* Required</span>

    <p-button
      type="button"
      label="Cancel"
      severity="secondary"
      [outlined]="true"
      [disabled]="saving()"
      (onClick)="onCancel()"
    />
    <p-button
      type="submit"
      label="Save"
      icon="pi pi-check"
      [loading]="saving()"
      [disabled]="saving()"
    />
  </footer>
</form>
