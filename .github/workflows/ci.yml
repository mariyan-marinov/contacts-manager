name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: contacts
          POSTGRES_USER: contacts
          POSTGRES_PASSWORD: contacts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contacts -d contacts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release
        env:
          ConnectionStrings__Contacts: Host=localhost;Port=5432;Database=contacts;Username=contacts;Password=contacts

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx ng lint
      - run: npx ng test
      - run: npx ng build --configuration production

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [api, web]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: contacts
          POSTGRES_USER: contacts
          POSTGRES_PASSWORD: contacts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contacts -d contacts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install the frontend
        run: npm ci
        working-directory: web

      - name: Install the e2e suite
        run: npm ci
        working-directory: tests/e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      # Playwright starts the API and the dev server itself; Postgres is the only service it needs.
      - name: Run Playwright
        run: npx playwright test
        working-directory: tests/e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
