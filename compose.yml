services:
  db:
    image: postgres:17-alpine
    container_name: contacts-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contacts}
      POSTGRES_USER: ${POSTGRES_USER:-contacts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contacts}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - contacts-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contacts} -d ${POSTGRES_DB:-contacts}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  contacts-data:
